<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Observatory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="app-container">
    <header class="main-header">
      <div class="brand">
        <div class="logo-wrapper">📡</div>
        <div class="brand-text">
          <h1 class="extension-name">API Observatory</h1>
          <span class="version-tag">PRO VERSION</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="open-sidepanel" class="icon-btn" title="Open Persistent Sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="15" y1="3" x2="15" y2="21"></line>
          </svg>
        </button>
      </div>
    </header>

    <main id="content" class="main-content">
      <!-- Loading State -->
      <div class="loading-state">
        <div class="pulse-loader"></div>
        <span>Syncing status...</span>
      </div>
    </main>

    <footer class="main-footer">
      <div class="footer-hint">Live data available in Chrome DevTools</div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>

</html>
