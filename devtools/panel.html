<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>API Observatory</title>
  <link rel="stylesheet" href="panel.css" />
</head>

<body>
  <div class="topbar">
    <div class="title" id="title-area">
      API Observatory
      <span class="pro-badge" id="pro-badge" style="display:none;">PRO</span>
    </div>
    <div id="status" class="status-indicator" style="margin-left: 10px; font-size: 11px; color: var(--text-secondary);">
      Connecting...</div>
    <div class="spacer"></div>
    <button id="pause">Pause</button>
    <button id="clear">Clear</button>
  </div>

  <div class="filters">
    <input type="text" id="search" placeholder="Search method or path..." />
    <label><input type="checkbox" id="onlySuccess"> Success only</label>
    <label><input type="checkbox" id="onlyErrors"> Errors only</label>
    <label><input type="checkbox" id="onlySlow"> Slow only</label>
  </div>

  <table>
    <thead id="thead"></thead>
    <tbody id="rows"></tbody>
  </table>

  <script src="panel.js"></script>
</body>

</html>
